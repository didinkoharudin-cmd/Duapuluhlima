<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10182d"><title>A Beautiful Chapter — Terri Rismayanti</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 30%,#29334e,#10182d 55%,#080d19);color:#f8e7c6;font-family:Georgia,serif;min-height:100svh;display:grid;place-items:center;text-align:center}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}main{position:relative;width:min(94%,560px);padding:65px 24px 45px;z-index:1}small{font:11px Arial;letter-spacing:4px;color:#d8b779}h1{font-size:clamp(35px,8vw,58px);font-weight:normal;line-height:1.08;margin:20px 0}h2{font-weight:normal;font-size:32px}p{font-size:17px;line-height:1.8;color:#e7dece}button{font:600 14px Arial;border:1px solid #e8cb91;border-radius:40px;padding:15px 25px;background:linear-gradient(110deg,#a67b3d,#f6dfa8,#bd9250);color:#201b19;cursor:pointer;margin:12px 4px;touch-action:manipulation}button:focus-visible{outline:3px solid white}#music{position:fixed;right:12px;top:10px;z-index:3;padding:10px 15px;background:#151e32;color:#f5dba5}#progress{position:fixed;top:25px;left:20px;z-index:2;font:11px Arial;letter-spacing:2px}.scene{animation:appear .85s both}@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.art{width:200px;height:190px;margin:20px auto;display:block;filter:drop-shadow(0 0 25px #cba65a55);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px)}}.letter{background:#f3e6cc;color:#493523;padding:24px;border-radius:4px;box-shadow:0 12px 50px #0006;text-align:left;min-height:200px}.letter p{color:#493523;white-space:pre-line;font-size:16px}.reason{border:1px solid #d8b77955;border-radius:12px;padding:20px;margin:15px 0;min-height:110px}.flame{transform-origin:center;animation:flicker .3s infinite alternate}@keyframes flicker{to{opacity:.65;transform:scale(.96)}}.out .flame{display:none}.heart{font-size:100px;color:#d9b77b;animation:float 2s infinite}.hint{font:12px Arial;color:#bdb3a4} @media(prefers-reduced-motion:reduce){*,*::before,*::after{ </style><canvas id="fx"></canvas><div id="progress"></div><button id="music" aria-label="Aktifkan atau matikan musik">♫ Musik off</button><main id="main"></main><script>
const main=document.querySelector('#main'), progress=document.querySelector('#progress');let step=0,reason=0,timer;const gift=`<svg class="art" viewBox="0 0 200 190" aria-hidden="true"><defs><linearGradient id="g"><stop stop-color="#93682e"/><stop offset=".5" stop-color="#ffe5a4"/><stop offset="1" stop-color="#b18a48"/></linearGradient></defs><path d="M100 54C25 49 48 0 100 54C152 0 175 49 100 54" fill="none" stroke="url(#g)" stroke-width="9"/><rect x="28" y="65" width="144" height="110" rx="7" fill="#263451" stroke="#e3c183"/><rect x="19" y="53" width="162" height="30" rx="5" fill="url(#g)"/><path d="M89 53H111V175H89Z" fill="url(#g)"/></svg>`;
const cake=`<svg class="art" id="cake" viewBox="0 0 200 190"><ellipse cx="100" cy="170" rx="88" ry="10" fill="#d2af70"/><rect x="25" y="100" width="150" height="65" rx="10" fill="#c9a36b"/><rect x="48" y="67" width="104" height="45" rx="9" fill="#f5dfba"/><path d="M25 120Q40 139 55 120T85 120T115 120T145 120T175 120" fill="none" stroke="#fff0d1" stroke-width="8"/>${[70,100,130].map(x=>`<rect x="${x-3}" y="43" width="6" height="26" fill="#e6b95e"/><path class="flame" d="M${x} 20q-15 19 0 21q15 -2 0 -21" fill="#ffcc69"/>`).join('')}</svg>`;
const reasons=['Karena senyummu mampu membuat hari yang biasa terasa istimewa.','Karena bersamamu, hal-hal sederhana punya arti yang lebih indah.','Karena kamu layak dicintai, dihargai, dan bahagia — hari ini dan setiap hari.','Because being with you is a beautiful part of my story.'];
const letter='Dear Terri,\n\nSelamat ulang tahun, sayang. Di hari istimewamu ini, aku ingin kamu tahu betapa berharganya kehadiranmu.\n\nSemoga usia yang baru membawa lebih banyak kebahagiaan, kesehatan, ketenangan, dan segala impian yang perlahan menjadi nyata. Semoga kita selalu punya alasan untuk tersenyum dan ruang untuk tumbuh bersama.\n\nThank you for being you. I hope life gives you all the love and happiness you deserve.\n\nWith love,\nOktober';
function render(){clearInterval(timer);progress.textContent=`0${step+1} / 07`;let scenes=[`<small>A BEAUTIFUL CHAPTER</small><h1>Terri<br>Rismayanti</h1><p>Tonight, the universe has a little surprise for you.</p><div class="heart">✧</div><p>From Oktober, with love.</p><button data-next>Begin your surprise ✨</button>`,`<small>JUST FOR YOU</small><h2>A Special Gift</h2>${gift}<p>Ada sesuatu yang ingin aku sampaikan, dengan cara yang sedikit berbeda.</p><button data-next>Open your gift</button>`,`<small>MAKE A WISH</small><h2>Close your eyes...</h2>${cake}<p>Pejamkan mata, ucapkan harapan terbaikmu, lalu padamkan lilinnya.</p><button id="blow">Tiup lilin ✨</button><div id="wish" aria-live="polite"></div>`,`<small>A THOUSAND REASONS</small><h2>Little things about you</h2><div class="heart">♡</div><div class="reason" id="reason" aria-live="polite">${reasons[reason]}</div><button id="more">${reason===3?'Buka surat rahasia':'Satu alasan lagi'} </button>`,`<small>SEALED WITH LOVE</small><h2>A Letter from Oktober</h2><div class="letter"><p id="letter">Untuk Terri, dengan cinta.</p></div><button id="read">Buka surat</button><button data-next hidden id="letterNext">One more surprise</button>`,`<small>ONE LAST SURPRISE</small><h2>A little promise</h2>${gift}<p>Hadiah ini bukan tentang seberapa mahal sesuatu, tetapi tentang betapa berharganya kamu.</p><button id="promise">Buka kejutan</button><div id="promiseText" aria-live="polite"></div>`,`<small>TODAY WE CELEBRATE YOU</small><div class="heart">♥</div><h1>Happy Birthday,<br>Terri!</h1><p>May your new chapter be filled with love, laughter, and beautiful moments.</p><p>Selamat bertambah usia, sayang.<br>With all my love, Oktober.</p><button id="again">Celebrate again ✨</button><button id="restart">Ulangi dari awal</button>`];main.innerHTML='<section class="scene">'+scenes[step]+'</section>';main.querySelectorAll('[data-next]').forEach(b=>b.onclick=next);const on=(id,fn)=>{let b=document.getElementById(id);if(b)b.onclick=fn};on('blow',()=>{document.querySelector('#cake').classList.add('out');document.querySelector('#blow').hidden=true;document.querySelector('#wish').innerHTML='<p>May your wish come true.</p><button id="continue">Lanjutkan</button>';on('continue',next);burst()});on('more',()=>{if(reason<3){reason++;render()}else next()});on('read',()=>{document.querySelector('#read').hidden=true;let i=0,el=document.querySelector('#letter');el.textContent='';document.querySelector('#letterNext').hidden=false;timer=setInterval(()=>{el.textContent=letter.slice(0,i+=4);if(i>=letter.length)clearInterval(timer)},24)});on('promise',()=>{document.querySelector('#promise').hidden=true;document.querySelector('#promiseText').innerHTML='<p>Semoga kita terus menciptakan kenangan indah, saling menjaga, dan menemukan kebahagiaan dalam hal-hal sederhana. ♡</p><button id="finale">The grand finale</button>';on('finale',next);burst()});on('again',burst);on('restart',()=>{step=0;reason=0;render()});if(step===6)burst()}
function next(){if(step===0&&!audioStarted)toggleMusic();step=Math.min(6,step+1);render();if(step===2)burst();window.scrollTo(0,0)}
let ctx,playing=false,audioStarted=false,musicTimer,master;const chords=[[48,55,60,64],[45,52,57,60],[41,48,53,57],[43,50,55,59],[52,55,60,64],[45,52,57,64],[41,48,57,60],[43,50,55,62]];let bar=0;function note(n,t,v){let f=440*2**((n-69)/12);[1,2,3].forEach((h,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f*h;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v/(h*h),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+1.8-i*.3);o.connect(g).connect(master);o.start(t);o.stop(t+1.9)})}function phrase(){if(!playing)return;let c=chords[bar++%chords.length],t=ctx.currentTime+.05;[0,1,2,3,2,1].forEach((j,i)=>note(c[j]+(i===3?12:0),t+i*.42,.13));musicTimer=setTimeout(phrase,2520)}async function toggleMusic(){audioStarted=true;try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.6;master.connect(ctx.destination)}if(playing){playing=false;clearTimeout(musicTimer);master.gain.setTargetAtTime(0,ctx.currentTime,.05)}else{await ctx.resume();playing=true;master.gain.setTargetAtTime(.6,ctx.currentTime,.05);phrase()}document.querySelector('#music').textContent=playing?'♫ Musik on':'♫ Musik off'}catch(e){document.querySelector('#music').textContent='Musik tidak tersedia'}}document.querySelector('#music').onclick=toggleMusic;
const canvas=document.querySelector('#fx'),g=canvas.getContext('2d');let w,h,stars=[],particles=[];function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;stars=Array.from({length:90},()=>[Math.random()*w,Math.random()*h,Math.random()*2,Math.random()*6])}addEventListener('resize',resize);resize();function burst(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let j=0;j<4;j++){let x=w*(.2+Math.random()*.6),y=h*(.15+Math.random()*.5);for(let i=0;i<65;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:['#f5d68b','#fff1cb','#e5a5b2','#b3c5ef'][i%4]})}}}function frame(t){g.clearRect(0,0,w,h);for(let [x,y,r,a] of stars){g.globalAlpha=.25+.25*Math.sin(t/900+a);g.fillStyle='#ffe1a0';g.beginPath();g.arc(x,y,r,0,7);g.fill()}particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.life-=.008;g.globalAlpha=p.life;g.fillStyle=p.c;g.fillRect(p.x,p.y,3,5)}g.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame);render();</script></html>
